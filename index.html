<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BCI Staff</title>

<!-- Home-screen name and icon (iPhone + Android) -->
<meta name="apple-mobile-web-app-title" content="BCI Staff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F2A44">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
  html, body { margin: 0; height: 100%; background: #1F2A44; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
  iframe { flex: 1; width: 100%; border: 0; background: #F2F4F8; }
  .fallback { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font: 13px Arial, sans-serif; display: none; }
  .fallback a { color: #fff; background: #1F2A44; padding: 8px 14px; border-radius: 20px; text-decoration: none; }
</style>
</head>
<body>
<!-- ============================================================
     PASTE YOUR APP LINK (ending in /exec) BETWEEN THE QUOTES BELOW
     ============================================================ -->
<script>
  var APP_URL = 'PASTE_YOUR_EXEC_LINK_HERE';
</script>

<iframe id="app" title="BCI Staff Attendance" allow="clipboard-write; geolocation"></iframe>
<div class="fallback" id="fb"><a id="fbLink" href="#" target="_blank" rel="noopener">Not loading? Open directly</a></div>

<script>
  document.getElementById('app').src = APP_URL;
  document.getElementById('fbLink').href = APP_URL;
  // Show a direct-open link if the app has not loaded after 12 seconds
  var loaded = false;
  document.getElementById('app').addEventListener('load', function () { loaded = true; });
  setTimeout(function () { if (!loaded) document.getElementById('fb').style.display = 'block'; }, 12000);
</script>
</body>
</html>
